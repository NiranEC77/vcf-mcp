[project]
name = "vcf-mcp"
version = "0.1.1"
description = "MCP server for configuring and managing VMware Cloud Foundation 9.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "vmware", "vcf", "sddc", "nsx", "vcenter", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/NiranEC77/vcf-mcp"
Issues = "https://github.com/NiranEC77/vcf-mcp/issues"

[project.scripts]
vcf-mcp = "vcf_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcf_mcp"]

# The OpenAPI specs are the server's data, not documentation: without them an
# installed copy indexes nothing. Ship them inside the package so `uvx` and
# `pip install` are both self-contained.
[tool.hatch.build.targets.wheel.force-include]
"specs" = "vcf_mcp/specs"

[tool.hatch.build.targets.sdist]
include = ["src", "specs", "tests", "README.md", "pyproject.toml", "hosts.example.json"]
